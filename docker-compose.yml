services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: asdrones
      POSTGRES_USER: asdrones
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asdrones -d asdrones"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://asdrones:${DB_PASSWORD}@db:5432/asdrones
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
  static_volume:
  media_volume:
